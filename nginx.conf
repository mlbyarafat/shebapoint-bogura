# Put nginx (+ a free CDN such as Cloudflare) in front of gunicorn. This is what makes 100,000+ visitors safe.
limit_req_zone $binary_remote_addr zone=perip:20m rate=20r/s;
limit_conn_zone $binary_remote_addr zone=conn:10m;
proxy_cache_path /var/cache/sheba levels=1:2 keys_zone=sheba:10m max_size=200m inactive=10m;
server {
  listen 443 ssl http2;  server_name shebapoint.example;  server_tokens off;
  ssl_certificate /etc/ssl/fullchain.pem;  ssl_certificate_key /etc/ssl/privkey.pem;
  client_max_body_size 1k;  client_body_timeout 5s;  client_header_timeout 5s;  keepalive_timeout 15s;
  gzip on;  gzip_types text/css application/javascript application/json image/svg+xml;
  location /static/ { alias /srv/sheba/static/; expires 7d; add_header Cache-Control "public, immutable"; }
  location / {
    limit_req zone=perip burst=60 nodelay;  limit_conn conn 30;
    proxy_cache sheba;  proxy_cache_valid 200 5m;  proxy_cache_use_stale error timeout updating;  proxy_cache_lock on;
    proxy_pass http://127.0.0.1:8000;
  }
}
